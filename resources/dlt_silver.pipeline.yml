resources:
  pipelines:
    dlt_silver:
      name: ${bundle.name}_silver_${bundle.target}
      catalog: github_lakehouse_ws
      schema: gh_lakehouse
      serverless: true
      continuous: false
      channel: CURRENT
      photon: false
      libraries:
        - notebook:
            path: ../src/gh_archive/silver_dlt.py
 
      configuration:
        bundle.sourcePath: ${workspace.file_path}/src
        dltparam.environment: ${bundle.target}
        dltparam.bronze_path: abfss://bronze@ghlakehousestorage.dfs.core.windows.net/gh_events
        dltparam.silver_path: abfss://silver@ghlakehousestorage.dfs.core.windows.net/
        spark.hadoop.fs.azure.account.key.ghlakehousestorage.dfs.core.windows.net: "{{secrets/gh-lakehouse-scope/ghlakehousestorage-key1}}"