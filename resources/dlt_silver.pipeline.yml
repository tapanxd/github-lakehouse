resources:
  pipelines:
    dlt_silver:
      name: ${bundle.name}_silver_${bundle.target}
      catalog: github_lakehouse_ws
      schema: gh_lakehouse
      continuous: false
      channel: CURRENT
      photon: false
      clusters:
        - label: default
          node_type_id: Standard_DS3_v2
          num_workers: 0
          spark_conf:
            spark.databricks.cluster.profile: singleNode
            spark.master: local[*]
            fs.azure.account.key.ghlakehousestorage.dfs.core.windows.net: "{{secrets/gh-lakehouse-scope/ghlakehousestorage-key1}}"
          custom_tags:
            ResourceClass: SingleNode
      libraries:
        - notebook:
            path: ../src/gh_archive/silver_dlt.py
 
      configuration:
        bundle.sourcePath: ${workspace.file_path}/src
        dltparam.environment: ${bundle.target}
        dltparam.bronze_path: abfss://bronze@ghlakehousestorage.dfs.core.windows.net/gh_events
        dltparam.silver_path: abfss://silver@ghlakehousestorage.dfs.core.windows.net/