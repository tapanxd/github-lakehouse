# 💡 Additional resource specifications can be found at https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/resources
resources:
  pipelines:
    dlt_silver:
      name: ${bundle.name}_pipeline_silver_${bundle.target}
      catalog: ${var.catalog_name}
      serverless: true
      schema: ${bundle.name}_silver
      # ⚠️ Tags via Databricks Asset Bundles is on the roadmap: https://community.databricks.com/t5/data-engineering/dlt-pipelines-with-dabs-support-for-tags-field/td-p/120188
      libraries:
        - notebook:
            path: ../src/taxi/dlt.silver.py
        - notebook:
            path: ../src/signal_strength_summary/dlt.silver.py
        - notebook:
            path: ../src/cell_tower_sessions/dlt.silver.py

      configuration:
        # Required base configurations
        bundle.sourcePath: ${workspace.file_path}/src
        dltparam.environment: ${bundle.target}
        dltparam.domain_name: ${var.domain_name}
        dltparam.catalog_name: ${var.catalog_name}
        dltparam.data_product_name: ${bundle.name}
        dltparam.bronze_schema_name: ${bundle.name}_bronze
        dltparam.silver_schema_name: ${bundle.name}_silver
        dltparam.gold_schema_name: ${bundle.name}
        dltparam.layer: silver
