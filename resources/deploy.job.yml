resources:
  jobs:
    deploy_job:
      name: ${bundle.name}_job_${bundle.target}
      description: |
        Orchestrates Bronze ingestion, Silver DLT, and Gold DLT pipelines
        for the GitHub Archive lakehouse data product.
      tags:
        environment: ${bundle.target}
        data_product: ${bundle.name}
      job_clusters:
        - job_cluster_key: main_cluster
          new_cluster:
            node_type_id: Standard_D4as_v5
            num_workers: 0
            spark_version: 15.4.x-scala2.12
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
              fs.azure.account.key.ghlakehousestorage.dfs.core.windows.net: "{{secrets/gh-lakehouse-scope/ghlakehousestorage-key1}}"
            custom_tags:
              ResourceClass: SingleNode
      trigger:
        periodic:
          interval: 1
          unit: HOURS

      tasks:
        - task_key: bronze_autoloader
          job_cluster_key: main_cluster
          max_retries: 1
          notebook_task:
            notebook_path: ../src/gh_archive/bronze_autoloader.py

        - task_key: silver_dlt
          depends_on:
            - task_key: bronze_autoloader
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_silver.id}

        - task_key: gold_dlt
          depends_on:
            - task_key: silver_dlt
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold.id}

        - task_key: cost_monitor
          job_cluster_key: main_cluster
          depends_on:
            - task_key: gold_dlt
          max_retries: 0
          notebook_task:
            notebook_path: ../src/cost_monitor/alert.py

      parameters:
        - name: environment
          default: ${bundle.target}
        - name: data_product_name
          default: ${bundle.name}