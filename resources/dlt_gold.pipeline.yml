resources:
  pipelines:
    dlt_gold:
      name: ${bundle.name}_gold_${bundle.target}
      catalog: github_lakehouse_ws
      schema: gh_lakehouse
      continuous: false
      channel: CURRENT
      photon: false
      libraries:
        - notebook:
            path: ../src/gh_archive/gold_dlt.py

      configuration:
        bundle.sourcePath: ${workspace.file_path}/src
        dltparam.environment: ${bundle.target}
        dltparam.silver_table: silver_gh_events
        dltparam.gold_path: abfss://gold@ghlakehousestorage.dfs.core.windows.net/
        spark.hadoop.fs.azure.account.key.ghlakehousestorage.dfs.core.windows.net: "{{secrets/gh-lakehouse-scope/ghlakehousestorage-key1}}"