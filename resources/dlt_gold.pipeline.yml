resources:
  pipelines:
    dlt_gold:
      name: ${bundle.name}_gold_${bundle.target}
      schema: gh_lakehouse
      storage: abfss://gold@ghlakehousestorage.dfs.core.windows.net/
      serverless: true
      continuous: false
      channel: CURRENT
      photon: true
      libraries:
        - notebook:
            path: ../src/gh_archive/gold_dlt.py

      configuration:
        bundle.sourcePath: ${workspace.file_path}/src
        dltparam.environment: ${bundle.target}
        dltparam.silver_table: silver_gh_events
        dltparam.gold_path: abfss://gold@ghlakehousestorage.dfs.core.windows.net/